function focusChar(ch){Object.keys(sprEls).forEach(function(k){
sprEls[k].classList.toggle("dim",k!==ch);sprEls[k].style.zIndex=(k===ch)?10:5;});}
function doFx(k){if(k==="shake"){stageEl.classList.add("shake");setTimeout(function(){stageEl.classList.remove("shake");},550);}
else{flashEl.className="";void flashEl.offsetWidth;flashEl.classList.add(k==="red"?"f-red":"f-white");}}
function addLog(nm,tx){var list=$("#logList");var d=document.createElement("div");d.className="logE";
d.innerHTML=(nm?"<b>"+nm+"</b>":"<b>……</b>")+"<span></span>";d.querySelector("span").textContent=tx;list.appendChild(d);
while(list.children.length>300)list.removeChild(list.firstChild);list.scrollTop=list.scrollHeight;}
function typeText(tx,done){dtEl.textContent="";G.typing=true;nextEl.classList.remove("show");
var i=0;var tm=setInterval(function(){
if(G.skip){clearInterval(tm);dtEl.textContent=tx;fin();return;}
i++;dtEl.textContent=tx.slice(0,i);if(i%2===0)sfxPlay("blip");
if(i>=tx.length){clearInterval(tm);fin();}},SPEED_MS[SETT.speed]);
function fin(){G.typing=false;G.finishType=null;nextEl.classList.add("show");done();}
G.finishType=function(){clearInterval(tm);dtEl.textContent=tx;fin();};}
function sayLine(ch,tx,mode){return new Promise(function(res){
var nm="",col="#d8b56a";
if(mode==="say"){nm=CHARS[ch].name;col=CHARS[ch].color;if(CHARS[ch]&&Object.keys(CHARS[ch].expr).length)focusChar(ch);}
else if(mode==="think"){nm=CHARS[ch].name+"・心聲";col=CHARS[ch].color;}
npEl.style.display=(mode==="narr")?"none":"block";
npEl.textContent=nm;npEl.style.borderColor=col;npEl.style.color=col;
dtEl.className=(mode==="narr")?"narr":(mode==="think")?"think":"";
addLog(mode==="narr"?"":nm,tx);
typeText(tx,function(){
G.onProceed=function(){G.onProceed=null;if(G.autoT){clearTimeout(G.autoT);G.autoT=null;}res();};
if(G.skip){setTimeout(function(){if(G.onProceed)G.onProceed();},70);}
else if(G.auto){G.autoT=setTimeout(function(){if(G.onProceed)G.onProceed();},AUTOWAIT[SETT.autoWait]+Math.min(1200,tx.length*12));}});
});}
function chapterCard(num,tt){return new Promise(function(res){sfxPlay("sting");chapEl.textContent=num+"　"+tt;
var cc=$("#chapterCard");$("#ccNum").textContent=num;$("#ccTitle").textContent=tt;cc.classList.remove("hidden");
var t0=Date.now(),closed=false;
function close(){if(closed)return;closed=true;cc.classList.add("hidden");res();}
cc.onclick=function(e){e.stopPropagation();if(Date.now()-t0>600)close();};
setTimeout(close,2600);});}
function showCg(k,cap){return new Promise(function(res){var L=$("#cgLayer");$("#cgImg").src=IMG[k];$("#cgCap").textContent=cap;L.classList.remove("hidden");
function close(e){e.stopPropagation();L.classList.add("hidden");L.onclick=null;res();}
L.onclick=close;});}
function doChoice(opts){return new Promise(function(res){G.waitChoice=true;var L=$("#choiceLayer");L.classList.remove("hidden");L.innerHTML="";
opts.forEach(function(o){var b=document.createElement("button");b.className="chbtn";b.textContent=o.tx;
b.onclick=function(e){e.stopPropagation();sfxPlay("click");L.classList.add("hidden");L.innerHTML="";G.waitChoice=false;G.i=LAB[o.to];res();};
L.appendChild(b);});});}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function exec(c){
switch(c.t){
case "bg":setBg(c.k);await delay(60);break;
case "mu":playMusic(c.k);break;
case "show":showChar(c.c,c.e,c.p);await delay(120);break;
case "hide":hideChar(c.c);await delay(100);break;
case "hideall":hideAllChars();await delay(100);break;
case "fx":doFx(c.k);await delay(c.k==="shake"?450:220);break;
case "sfx":sfxPlay(c.k);await delay(60);break;
case "n":await sayLine(null,c.tx,"narr");break;
case "th":await sayLine(c.c,c.tx,"think");break;
case "s":await sayLine(c.c,c.tx,"say");break;
case "ch":await chapterCard(c.num,c.tt);break;
case "cg":await showCg(c.k,c.cap);break;
case "choice":await doChoice(c.opts);break;
case "label":break;
case "goto":G.i=LAB[c.id];break;
case "end":showEnd();G.waitChoice=true;break;
}}
async function run(){if(G.running)return;G.running=true;
while(G.i<Q.length&&!G.waitChoice){var c=Q[G.i++];await exec(c);}
G.running=false;}
function advance(){if(!G.started)return;
if(!$("#chapterCard").classList.contains("hidden"))return;
if(!$("#cgLayer").classList.contains("hidden"))return;
if(!$("#choiceLayer").classList.contains("hidden"))return;
if(!$("#logLayer").classList.contains("hidden"))return;
if(!$("#setLayer").classList.contains("hidden"))return;
if(!$("#endLayer").classList.contains("hidden"))return;
if(G.typing&&G.finishType){G.finishType();return;}
if(G.onProceed){if(G.autoT){clearTimeout(G.autoT);G.autoT=null;}var f=G.onProceed;G.onProceed=null;f();}}
stageEl.addEventListener("click",function(){if(actx&&actx.state==="suspended")actx.resume();advance();});
document.addEventListener("keydown",function(e){
if(e.key===" "||e.key==="Enter"){e.preventDefault();advance();}
if(e.key==="Escape"){$("#logLayer").classList.add("hidden");$("#setLayer").classList.add("hidden");}});
/* -------- 頂欄按鈕 -------- */
$("#btnAuto").onclick=function(e){e.stopPropagation();G.auto=!G.auto;this.classList.toggle("on",G.auto);sfxPlay("click");};
$("#btnSkip").onclick=function(e){e.stopPropagation();G.skip=!G.skip;this.classList.toggle("on",G.skip);sfxPlay("click");};
$("#btnLog").onclick=function(e){e.stopPropagation();sfxPlay("click");$("#logLayer").classList.remove("hidden");};
$("#logClose").onclick=function(e){e.stopPropagation();$("#logLayer").classList.add("hidden");};
$("#btnSet").onclick=function(e){e.stopPropagation();sfxPlay("click");$("#setLayer").classList.remove("hidden");};
$("#btnMute").onclick=function(e){e.stopPropagation();SETT.muted=!SETT.muted;this.textContent=SETT.muted?"♪OFF":"♪ON";this.classList.toggle("on",SETT.muted);applyVol();};
$("#setClose").onclick=function(e){e.stopPropagation();$("#setLayer").classList.add("hidden");};
function grpBind(id,key){var el=$(id);el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(e){e.stopPropagation();
el.querySelectorAll(".opt").forEach(function(x){x.classList.remove("on");});b.classList.add("on");SETT[key]=b.dataset.v;sfxPlay("click");};});}
grpBind("#grpSpeed","speed");grpBind("#grpAuto","autoWait");
$("#volBgm").oninput=function(){SETT.bgm=this.value/100;applyVol();};
$("#volSfx").oninput=function(){SETT.sfx=this.value/100;applyVol();};
$("#btnSetT").onclick=function(e){e.stopPropagation();$("#setLayer").classList.remove("hidden");};
function showEnd(){$("#endLayer").classList.remove("hidden");}
$("#btnRestart").onclick=function(){location.reload();};
$("#btnToTitle").onclick=function(){location.reload();};
/* -------- 標題花瓣 -------- */
var petCv=$("#petals"),petCtx=petCv.getContext("2d"),petals=[],petRun=false;
function petInit(){petCv.width=1280;petCv.height=720;petals=[];for(var i=0;i<40;i++)petals.push({x:Math.random()*1280,y:Math.random()*720,r:4+Math.random()*7,a:Math.random()*Math.PI*2,va:(Math.random()-0.5)*0.04,vy:0.6+Math.random()*1.2,vx:-0.4-Math.random()*0.8});petRun=true;petLoop();}
function petLoop(){if(!petRun)return;petCtx.clearRect(0,0,1280,720);
petals.forEach(function(p){p.x+=p.vx+Math.sin(p.y*0.01)*0.4;p.y+=p.vy;p.a+=p.va;
if(p.y>730){p.y=-10;p.x=Math.random()*1300;}
petCtx.save();petCtx.translate(p.x,p.y);petCtx.rotate(p.a);petCtx.fillStyle="rgba(255,183,197,0.75)";
petCtx.beginPath();petCtx.ellipse(0,0,p.r,p.r*0.55,0,0,Math.PI*2);petCtx.fill();petCtx.restore();});
requestAnimationFrame(petLoop);}
/* -------- 載入 -------- */
var totalAssets=0,loadedAssets=0;
function bump(){loadedAssets++;var p=Math.round(loadedAssets/totalAssets*100);loadFill.style.width=p+"%";loadPct.textContent="載入資源中… "+p+"%";}
function loadPlain(url){return new Promise(function(res){var im=new Image();im.onload=function(){bump();res();};im.onerror=function(){bump();res();};im.src=url;});}
function loadSprite(key,url){return new Promise(function(res){
var done=false;
function finish(src){if(done)return;done=true;SPR[key]=src;bump();res();}
var cors=new Image();cors.crossOrigin="anonymous";
cors.onload=function(){try{finish(processChroma(cors));}catch(e){finish(url);}};
cors.onerror=function(){var p2=new Image();p2.onload=function(){finish(url);};p2.onerror=function(){finish(url);};p2.src=url;};
cors.src=url;
});}
async function preload(){
var sprKeys=["xh_s","xh_sad","xh_ang","xh_shock","xh_smug","xh_glass","js_s","js_g","js_ang","fa_st","fa_sm","fa_scared","fa_lech","nn_s","ly_s","me_s","baby_s"];
var plainKeys=["bg_title","bg_living","bg_rest","bg_nursery","bg_lawyer","bg_cafe","cg_coffee","cg_ending"];
totalAssets=sprKeys.length+plainKeys.length;
var tasks=sprKeys.map(function(k){return loadSprite(k,IMG[k]);}).concat(plainKeys.map(function(k){return loadPlain(IMG[k]);}));
await Promise.all(tasks);
sprKeys.forEach(function(k){if(!SPR[k])SPR[k]=IMG[k];});
}
preload().then(function(){
loadEl.classList.add("hidden");
titleEl.classList.remove("hidden");
titleEl.style.backgroundImage="url("+IMG.bg_title+")";
petInit();});
$("#btnStart").onclick=function(e){e.stopPropagation();initAudio();if(actx.state==="suspended")actx.resume();
petRun=false;titleEl.classList.add("hidden");loadEl.classList.add("hidden");
topEl.classList.remove("hidden");dlgEl.classList.remove("hidden");
G.started=true;playMusic("sad");run();};
})();
</script>
</body>
</html>
